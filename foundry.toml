[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Arc targets an Osaka EVM baseline; solc has no `osaka` target yet, and `cancun`
# emits only opcodes Osaka still honours, so it is the safe compilation target.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
